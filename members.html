  <script src="js/roster.js"></script>
  <script>
    (function () {
      'use strict';
      var grid = document.getElementById('rosterGrid');
      var statusEl = document.getElementById('rosterStatus');
      if (!grid) return;

      var FMT = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return FMT[c]; });
      }
      function joinedLabel(dateStr) {
        if (!dateStr) return 'joined early';
        var d = /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? new Date(dateStr + 'T00:00:00Z') : new Date(dateStr);
        if (isNaN(d.getTime())) return 'joined';
        return 'joined ' + d.toISOString().slice(0, 10);
      }

      function render(users) {
        if (users === null) {
          grid.innerHTML = '';
          statusEl.className = 'roster-status off';
          if (window.B0Roster && window.B0Roster.configured()) {
            statusEl.innerHTML =
              '<b>Couldn&#39;t reach the roster.</b> Check your internet connection or try again in a few seconds. ' +
              '<br><button class="btn btn-ghost roster-retry" type="button">↻ Try again</button>';
            var retry = statusEl.querySelector('.roster-retry');
            if (retry) retry.addEventListener('click', load);
          } else {
            statusEl.innerHTML =
              '<b>The shared roster isn&#39;t switched on yet.</b> Signups still work on each device — the owner just ' +
              'needs to connect the free Google Sheet backend (see <code>server/roster/SETUP.md</code>) to make this ' +
              'page live. No player info is sent anywhere until that&#39;s done.';
          }
          return;
        }
        grid.innerHTML = '';
        if (!users.length) {
          statusEl.className = 'roster-status on';
          statusEl.textContent = 'No members yet — be the first to sign up!';
          return;
        }
        statusEl.className = 'roster-status on';
        statusEl.textContent = users.length + ' player' + (users.length === 1 ? '' : 's') + ' on the shared roster.';
        var sorted = users.slice().sort(function (a, b) {
          return String(b.joined || '').localeCompare(String(a.joined || ''));
        });
        var html = '';
        for (var i = 0; i < sorted.length; i++) {
          var u = sorted[i];
          html += '<div class="member" style="animation-delay:' + Math.min(i * 0.035, 0.9) + 's">' +
            '<div class="member-avatar">' + esc(u.avatar || '👤') + '</div>' +
            '<div class="member-name">' + esc(u.username) + '</div>' +
            '<div class="member-title">' + esc(u.title || 'member') + '</div>' +
            '<div class="member-joined">' + esc(joinedLabel(u.joined)) + '</div>' +
            '</div>';
        }
        grid.innerHTML = html;
      }

      function load() {
        B0Roster.list(true)
          .then(render)
          .catch(function () { render(null); });
      }

      load();
      /* auto-refresh so new signups show up while the page is open */
      setInterval(load, 45000);
    })();
  </script>
