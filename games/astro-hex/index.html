<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Astro Hex — 0xB0 Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(900px 600px at 50% -10%, #0a1030, #05070f 65%);
    color: #e8f0ff; touch-action: manipulation; user-select: none;
  }
  h1 { font-size: 24px; margin: 0; letter-spacing: -1px; color: #a78bfa; text-shadow: 0 0 18px rgba(167, 139, 250, .45); }
  h1 span { color: #93a5c8; font-size: 11px; letter-spacing: 3px; display: block; text-align: center; }
  .top { display: flex; gap: 10px; }
  .stat { background: #0e1526; border: 1px solid #1d2a47; border-radius: 10px; padding: 6px 16px; text-align: center; min-width: 74px; }
  .stat .lbl { font-size: 10px; letter-spacing: 2px; color: #93a5c8; font-weight: 700; }
  .stat .val { font-size: 20px; font-weight: 800; font-family: Consolas, monospace; color: #a78bfa; }
  #stage { position: relative; }
  canvas { display: block; border-radius: 16px; border: 2px solid #1d2a47; box-shadow: 0 14px 50px rgba(0, 0, 0, .6); max-height: 70vh; width: auto; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; border-radius: 16px; z-index: 5;
    background: rgba(5, 9, 18, .78); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { margin: 0; font-size: 30px; }
  .overlay p { margin: 0; color: #93a5c8; font-size: 14px; }
  button {
    background: linear-gradient(92deg, #a78bfa, #00b3ff); color: #0b0620;
    font-weight: 800; font-size: 14px; border: none; padding: 10px 20px;
    border-radius: 10px; cursor: pointer; margin-top: 8px;
    box-shadow: 0 6px 22px rgba(167, 139, 250, .3);
  }
  .hint { color: #93a5c8; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div class="top">
    <h1>🚀 ASTRO HEX<span>0xB0 GAMES</span></h1>
    <div class="stat"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="lbl">WAVE</div><div class="val" id="wave">1</div></div>
    <div class="stat"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="380" height="520"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="hint">Move: ← → / A D / drag • Your ship fires automatically 🔫</div>

<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var overlay = document.getElementById('overlay');
  var scoreEl = document.getElementById('score'), waveEl = document.getElementById('wave'), bestEl = document.getElementById('best');
  var W = 380, H = 520;
  var ship, bullets, rocks, stars, score, wave, lives, state, frame, spawnEvery, invuln;
  var best = +(localStorage.getItem('0xb0-astro-best') || 0);
  bestEl.textContent = best;

  function showOverlay(title, sub, btn, onclick) {
    overlay.innerHTML = '<h2>' + title + '</h2><p>' + sub + '</p>';
    var b = document.createElement('button'); b.textContent = btn; b.onclick = onclick;
    overlay.appendChild(b); overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function makeRock(size, x, y) {
    var pts = [];
    var n = 8 + ~~(Math.random() * 4);
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i) / n;
      var rad = rockR(size) * (0.72 + Math.random() * 0.32);
      pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
    }
    return {
      size: size, x: x, y: y,
      vx: (Math.random() - 0.5) * 1.4,
      vy: (0.7 + Math.random() * 1.2) * (1 + (wave - 1) * 0.12),
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.04,
      pts: pts
    };
  }
  function rockR(size) { return [0, 13, 22, 34][size] || 13; }

  function spawnRock() {
    rocks.push(makeRock(3, 30 + Math.random() * (W - 60), -40));
  }

  function reset(autoStart) {
    ship = { x: W / 2, y: H - 60, r: 13, cool: 0 };
    bullets = [];
    rocks = [];
    stars = [];
    for (var i = 0; i < 50; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 1.6 });
    score = 0; wave = 1; lives = 3; frame = 0; invuln = 0;
    spawnEvery = 90;
    state = autoStart ? 'play' : 'ready';
    scoreEl.textContent = 0; waveEl.textContent = 1;
    if (!autoStart) {
      showOverlay('🚀 Astro Hex', 'Shoot the rocks. Big ones split. Don\'t get flattened.', 'Launch', function () {
        hideOverlay(); state = 'play';
      });
    }
  }

  function shipHex(x, y, r, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = Math.PI / 3 * i - Math.PI / 2;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = glow ? 'rgba(167,139,250,0.5)' : '#a78bfa';
    ctx.fill();
    ctx.strokeStyle = '#d4c5ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    /* space */
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(function (s) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + s.s * 0.25) + ')';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    });

    /* bullets */
    ctx.fillStyle = '#7dfccd';
    bullets.forEach(function (b) {
      ctx.shadowColor = '#00e5a0'; ctx.shadowBlur = 8;
      ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
    });
    ctx.shadowBlur = 0;

    /* rocks */
    rocks.forEach(function (r) {
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      ctx.beginPath();
      r.pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
      ctx.closePath();
      ctx.strokeStyle = '#93a5c8';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#131c33';
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    /* ship (blinks while invulnerable) */
    if (state === 'play' && !(invuln > 0 && ~~(frame / 4) % 2 === 0)) {
      shipHex(ship.x, ship.y, ship.r);
    }
    /* lives */
    for (var i = 0; i < lives; i++) shipHex(24 + i * 26, 22, 7);

    if (state === 'ready') {
      ctx.fillStyle = 'rgba(232,240,255,.6)';
      ctx.font = '600 13px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('← → / A D / drag to move', W / 2, H - 90);
    }
  }

  function step() {
    frame++;
    stars.forEach(function (s) {
      s.y += s.s;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    });
    if (state !== 'play') return;

    if (invuln > 0) invuln--;

    /* difficulty ramp */
    if (frame % 600 === 0 && spawnEvery > 40) {
      spawnEvery -= 8;
      wave++;
      waveEl.textContent = wave;
      rocks.forEach(function (r) { r.vy *= 1.06; });
    }

    /* ship movement */
    if (keys.left) ship.x -= 5;
    if (keys.right) ship.x += 5;
    ship.x = Math.max(18, Math.min(W - 18, ship.x));

    /* auto-fire */
    if (frame % (spawnEvery > 60 ? 12 : 10) === 0) {
      bullets.push({ x: ship.x, y: ship.y - 16 });
    }
    bullets.forEach(function (b) { b.y -= 8; });
    bullets = bullets.filter(function (b) { return b.y > -20; });

    /* rocks */
    if (frame % spawnEvery === 0) spawnRock();
    rocks.forEach(function (r) {
      r.x += r.vx; r.y += r.vy; r.rot += r.vr;
      if (r.x < rockR(r.size) || r.x > W - rockR(r.size)) r.vx *= -1;
    });
    rocks = rocks.filter(function (r) { return r.y < H + 60; });

    /* bullet hits rock */
    for (var i = rocks.length - 1; i >= 0; i--) {
      var r = rocks[i];
      var hit = -1;
      for (var j = 0; j < bullets.length; j++) {
        var dx = bullets[j].x - r.x, dy = bullets[j].y - r.y;
        if (dx * dx + dy * dy < rockR(r.size) * rockR(r.size)) { hit = j; break; }
      }
      if (hit >= 0) {
        bullets.splice(hit, 1);
        rocks.splice(i, 1);
        score += [0, 100, 50, 20][r.size];
        scoreEl.textContent = score;
        if (r.size > 1) {
          rocks.push(makeRock(r.size - 1, r.x - 10, r.y));
          rocks.push(makeRock(r.size - 1, r.x + 10, r.y));
        }
      }
    }

    /* rock hits ship */
    if (invuln <= 0) {
      for (var k = 0; k < rocks.length; k++) {
        var ddx = rocks[k].x - ship.x, ddy = rocks[k].y - ship.y;
        var rr = rockR(rocks[k].size) + ship.r - 4;
        if (ddx * ddx + ddy * ddy < rr * rr) {
          rocks.splice(k, 1);
          lives--;
          invuln = 120;
          if (lives <= 0) {
            state = 'dead';
            if (score > best) { best = score; localStorage.setItem('0xb0-astro-best', best); bestEl.textContent = best; }
            showOverlay('💀 Ship destroyed', 'Score: ' + score + ' • Wave ' + wave, 'Fly again', function () {
              hideOverlay(); reset(true);
            });
          }
          break;
        }
      }
    }
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  /* ---- input ---- */
  var keys = { left: false, right: false };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  function dragTo(clientX) {
    var rect = cv.getBoundingClientRect();
    ship.x = Math.max(18, Math.min(W - 18, (clientX - rect.left) * (W / rect.width)));
  }
  cv.addEventListener('mousemove', function (e) { dragTo(e.clientX); });
  cv.addEventListener('touchstart', function (e) { dragTo(e.touches[0].clientX); }, { passive: true });
  cv.addEventListener('touchmove', function (e) { dragTo(e.touches[0].clientX); }, { passive: true });

  reset();
  loop();
})();
</script>
</body>
</html>
