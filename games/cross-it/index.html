<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cross It — 0xB0 Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(900px 600px at 50% -10%, #14213f, #070b14 60%);
    color: #e8f0ff; touch-action: manipulation; user-select: none; overflow: hidden;
  }
  h1 { font-size: 22px; margin: 0; color: #00b3ff; }
  h1 span { color: #93a5c8; font-size: 10px; letter-spacing: 3px; display: block; text-align: center; }
  canvas { display: block; border-radius: 14px; border: 2px solid #1d2a47; box-shadow: 0 14px 50px rgba(0,0,0,.5); max-width: 95vw; touch-action: none; }
  .score { font-size: 22px; font-weight: 800; font-family: Consolas, monospace; color: #00b3ff; }
  .hint { color: #93a5c8; font-size: 12px; text-align: center; }
  button {
    background: linear-gradient(92deg, #00b3ff, #b46bff); color: #04121c;
    font-weight: 800; font-size: 14px; border: none; padding: 10px 20px;
    border-radius: 10px; cursor: pointer; font-family: inherit; display: none;
    box-shadow: 0 6px 20px rgba(0,179,255,.3);
  }
</style>
</head>
<body>
  <h1>🐸 CROSS IT<span>0xB0 GAMES</span></h1>
  <div class="score" id="score">0</div>
  <canvas id="cv" width="320" height="480"></canvas>
  <button id="restartBtn">↺ Play Again</button>
  <div class="hint">Swipe / Arrow keys to hop across traffic</div>

<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 320, H = 480;
  var scoreEl = document.getElementById('score');
  var restartBtn = document.getElementById('restartBtn');
  var CELL = 40;

  var player, cars, logs, frame, score, state, best, waterLane, roadLanes;
  best = +(localStorage.getItem('0xb0-cross-best') || 0);

  var CAR_COLORS = ['#ff5470', '#ffd166', '#00e5a0', '#b46bff', '#00b3ff'];

  function reset() {
    player = { col: 3, row: 11 };
    cars = [];
    logs = [];
    frame = 0; score = 0; state = 'play';
    scoreEl.textContent = '0';
    restartBtn.style.display = 'none';
    buildWorld();
  }

  function buildWorld() {
    /* rows 0-3 = grass goal, 4-5 = water (logs), 6-9 = road (cars), 10 = start grass */
    for (var r = 0; r < 12; r++) {
      if (r >= 6 && r <= 9) {
        /* road row */
        var dir = Math.random() < 0.5 ? 1 : -1;
        var speed = 1 + Math.random() * 1.5;
        for (var i = 0; i < 3; i++) {
          cars.push({
            row: r, x: Math.random() * W, dir: dir, speed: speed,
            color: CAR_COLORS[~~(Math.random() * CAR_COLORS.length)]
          });
        }
      } else if (r >= 4 && r <= 5) {
        /* water row — logs */
        var ldir = Math.random() < 0.5 ? 1 : -1;
        for (var j = 0; j < 2; j++) {
          logs.push({ row: r, x: Math.random() * W, dir: ldir, speed: 0.8 + Math.random() });
        }
      }
    }
  }

  function move(dx, dy) {
    if (state !== 'play') return;
    var nc = Math.max(0, Math.min(7, player.col + dx));
    var nr = Math.max(0, Math.min(11, player.row + dy));
    player.col = nc;
    player.row = nr;
    if (nr < score / 10) { /* moving forward */
      score = Math.max(score, (11 - nr) * 10);
      scoreEl.textContent = score;
    }
  }

  function step() {
    frame++;
    if (state === 'play') {
      cars.forEach(function (c) { c.x += c.speed * c.dir; });
      cars = cars.filter(function (c) { return c.x > -80 && c.x < W + 80; });
      cars.forEach(function (c) {
        if (c.x < -60 && c.dir < 0) c.x = W + 60;
        if (c.x > W + 60 && c.dir > 0) c.x = -60;
      });

      logs.forEach(function (l) { l.x += l.speed * l.dir; });
      logs.forEach(function (l) {
        if (l.x < -100) l.x = W + 80;
        if (l.x > W + 80) l.x = -100;
      });

      /* collision check — cars */
      var px = player.col * CELL + CELL / 2;
      var py = player.row * CELL + CELL / 2;
      for (var i = 0; i < cars.length; i++) {
        var c = cars[i];
        if (c.row === player.row) {
          if (Math.abs(c.x + CELL / 2 - px) < CELL * 0.7) {
            die();
            break;
          }
        }
      }

      /* water check */
      if (player.row >= 4 && player.row <= 5) {
        var onLog = false;
        for (var j = 0; j < logs.length; j++) {
          var l = logs[j];
          if (l.row === player.row && Math.abs(l.x + CELL - px) < CELL * 0.9) {
            onLog = true;
            player.col += l.dir * l.speed * 0.15;
            if (player.col < -0.5 || player.col > 7.5) { die(); }
            break;
          }
        }
        if (!onLog) { die(); }
      }

      /* goal */
      if (player.row === 0) {
        score += 100;
        scoreEl.textContent = score;
        state = 'win';
        if (score > best) { best = score; localStorage.setItem('0xb0-cross-best', best); }
        restartBtn.style.display = 'block';
        restartBtn.textContent = '🏆 Next Level!';
      }
    }
    draw();
    requestAnimationFrame(step);
  }

  function die() {
    state = 'dead';
    if (score > best) { best = score; localStorage.setItem('0xb0-cross-best', best); }
    restartBtn.style.display = 'block';
    restartBtn.textContent = '💀 Retry (best: ' + best + ')';
  }

  function draw() {
    ctx.fillStyle = '#0d0714';
    ctx.fillRect(0, 0, W, H);

    for (var r = 0; r < 12; r++) {
      var y = r * CELL;
      if (r <= 3 || r >= 10) {
        ctx.fillStyle = r <= 3 ? '#0f4d3a' : '#0f4d3a';
        ctx.fillRect(0, y, W, CELL);
        ctx.fillStyle = 'rgba(23,201,100,.1)';
        for (var gx = 0; gx < W; gx += 20) ctx.fillRect(gx + (r * 13) % 20, y + 8, 12, 4);
      } else if (r >= 4 && r <= 5) {
        ctx.fillStyle = '#0c3a6e';
        ctx.fillRect(0, y, W, CELL);
        ctx.fillStyle = 'rgba(0,179,255,.15)';
        for (var wx = 0; wx < W; wx += 16) ctx.fillRect(wx, y + 10, 10, 3);
      } else {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, y, W, CELL);
        if (r === 6 || r === 8) {
          ctx.strokeStyle = 'rgba(255,255,255,.15)';
          ctx.setLineDash([8, 8]);
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    /* logs */
    logs.forEach(function (l) {
      var y = l.row * CELL;
      ctx.fillStyle = '#8a5a2b';
      ctx.fillRect(l.x, y + 8, CELL * 2, CELL - 16);
      ctx.fillStyle = '#5e3a17';
      ctx.fillRect(l.x + 4, y + 10, CELL * 2 - 8, 6);
    });

    /* cars */
    cars.forEach(function (c) {
      var y = c.row * CELL;
      ctx.fillStyle = c.color;
      ctx.shadowColor = c.color; ctx.shadowBlur = 6;
      ctx.fillRect(c.x + 4, y + 8, CELL - 8, CELL - 16);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.fillRect(c.x + 8, y + 12, 10, 8);
    });

    /* player frog */
    var py = player.row * CELL + CELL / 2;
    var px = player.col * CELL + CELL / 2;
    ctx.save();
    ctx.translate(px, py);
    if (state === 'dead') { ctx.globalAlpha = 0.4; }
    ctx.shadowColor = '#00e5a0'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#00e5a0';
    ctx.beginPath();
    ctx.arc(0, -4, 6, 0, Math.PI * 2); ctx.fill(); /* head */
    ctx.beginPath(); ctx.arc(-8, 6, 5, 0, Math.PI * 2); ctx.fill(); /* left leg */
    ctx.beginPath(); ctx.arc(8, 6, 5, 0, Math.PI * 2); ctx.fill(); /* right leg */
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#04121c';
    ctx.beginPath(); ctx.arc(-3, -8, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -8, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (state === 'dead') {
      ctx.fillStyle = 'rgba(255,84,112,.9)';
      ctx.font = '800 22px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('💀', px, py);
    }
    if (state === 'win') {
      ctx.fillStyle = 'rgba(0,229,160,.9)';
      ctx.font = '800 22px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('🏆', px, py);
    }
  }

  /* input */
  var tx = 0, ty = 0;
  cv.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else move(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    var dirs = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
                 w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
    var dir = dirs[e.key];
    if (dir) { e.preventDefault(); move(dir[0], dir[1]); }
  });

  restartBtn.addEventListener('click', function () {
    if (state === 'win') { /* keep score, just reset position */ player.row = 11; player.col = 3; state = 'play'; }
    else reset();
    restartBtn.style.display = 'none';
  });

  reset();
  step();
})();
</script>
</body>
</html>
